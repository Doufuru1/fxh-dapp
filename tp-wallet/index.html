<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TP Wallet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <button class="menu-btn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="wallet-status">
        <div class="status-dot"></div>
      </div>
      <div class="header-right">
        <button class="icon-btn">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        </button>
        <button class="icon-btn">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        </button>
        <button class="icon-btn">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg>
        </button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main" id="main">
      <!-- Wallet Tab -->
      <section class="tab-page active" id="tab-wallet">
        <div class="balance-card">
          <div class="balance-card-header">
            <div class="wallet-label" id="walletLabel">
              <span id="walletName">TRX-1</span>
              <svg id="walletLock" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <span class="watch-tag" id="watchTag">观察钱包</span>
              <svg class="dropdown-arrow" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
            </div>
            <button class="more-btn">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="6" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="18" r="2"/></svg>
            </button>
          </div>
          <div class="balance-row">
            <div class="balance-value" id="balanceValue">$511,887.43</div>
            <button class="eye-btn" id="eyeBtn">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
            <div class="chain-icon" style="background: #fff;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2979ff" stroke-width="2"><polygon points="12 2 22 8.5 22 15.5 12 22 2 15.5 2 8.5 12 2"/><line x1="12" y1="22" x2="12" y2="15.5"/><polyline points="22 8.5 12 15.5 2 8.5"/><line x1="2" y1="15.5" x2="12" y2="8.5"/><line x1="22" y1="15.5" x2="12" y2="8.5"/></svg>
            </div>
          </div>
        </div>

        <div class="quick-actions">
          <button class="action-btn" data-action="send">
            <div class="action-icon">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/></svg>
            </div>
            <span>转账</span>
          </button>
          <button class="action-btn" data-action="receive">
            <div class="action-icon">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15V3m0 12l-4-4m4 4l4-4M2 17l.62 1.23a2 2 0 001.79 1.11h15.18a2 2 0 001.79-1.11L22 17"/></svg>
            </div>
            <span>收款</span>
          </button>
          <button class="action-btn" data-action="resources">
            <div class="action-icon">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
            </div>
            <span>资源</span>
          </button>
          <button class="action-btn" data-action="more">
            <div class="action-icon">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
            </div>
            <span>更多工具</span>
          </button>
        </div>

        <div class="tokens-header">
          <div class="tabs">
            <button class="tab active" data-tab="assets">资产</button>
            <button class="tab" data-tab="auth">授权</button>
          </div>
          <button class="add-token-btn">
            <div class="badge">2</div>
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
          </button>
        </div>

        <div class="token-list" id="tokenList"></div>

        <div class="auth-list" id="authList" style="display:none;">
          <div class="auth-item">
            <div class="auth-left">
              <div class="auth-icon" style="background: #ff6b6b;">U</div>
              <div class="auth-info">
                <div class="auth-name">Uniswap V3</div>
                <div class="auth-desc">已授权 USDT</div>
              </div>
            </div>
            <div class="auth-right">
              <div class="auth-amount">无限额度</div>
              <button class="auth-revoke">取消授权</button>
            </div>
          </div>
          <div class="auth-item">
            <div class="auth-left">
              <div class="auth-icon" style="background: #4facfe;">P</div>
              <div class="auth-info">
                <div class="auth-name">PancakeSwap</div>
                <div class="auth-desc">已授权 BNB</div>
              </div>
            </div>
            <div class="auth-right">
              <div class="auth-amount">1,000.00</div>
              <button class="auth-revoke">取消授权</button>
            </div>
          </div>
        </div>
      </section>

      <!-- Market Tab -->
      <section class="tab-page" id="tab-market">
        <div class="market-header">
          <h2>行情</h2>
          <div class="market-search">
            <input type="text" placeholder="搜索币种">
          </div>
        </div>
        <div class="market-tabs">
          <button class="market-tab active">热门</button>
          <button class="market-tab">涨幅榜</button>
          <button class="market-tab">跌幅榜</button>
          <button class="market-tab">新币</button>
        </div>
        <div class="market-list" id="marketList"></div>
      </section>

      <!-- Trade Tab -->
      <section class="tab-page" id="tab-trade">
        <div class="trade-header">
          <h2>交易</h2>
        </div>
        <div class="trade-card">
          <div class="trade-tabs">
            <button class="trade-tab active">闪兑</button>
            <button class="trade-tab">限价</button>
          </div>
          <div class="trade-inputs">
            <div class="trade-input-row">
              <div class="trade-input-label">支付</div>
              <div class="trade-input">
                <input type="text" placeholder="0.00" value="">
                <div class="trade-token">
                  <div class="mini-token" style="background: #f7931a;">B</div>
                  <span>BTC</span>
                </div>
              </div>
              <div class="trade-balance">余额：12.5 BTC</div>
            </div>
            <div class="swap-divider">
              <div class="swap-arrow">⇅</div>
            </div>
            <div class="trade-input-row">
              <div class="trade-input-label">接收</div>
              <div class="trade-input">
                <input type="text" placeholder="0.00" value="">
                <div class="trade-token">
                  <div class="mini-token" style="background: #26a17b;">U</div>
                  <span>USDT</span>
                </div>
              </div>
              <div class="trade-balance">余额：8,500.00 USDT</div>
            </div>
          </div>
          <button class="trade-confirm">立即兑换</button>
        </div>
      </section>

      <!-- Discover Tab -->
      <section class="tab-page" id="tab-discover">
        <div class="discover-header">
          <h2>发现</h2>
        </div>
        <div class="discover-grid">
          <div class="discover-card">
            <div class="discover-icon" style="background: linear-gradient(135deg, #ff6b6b, #ee5a6f);">🎮</div>
            <span>GameFi</span>
          </div>
          <div class="discover-card">
            <div class="discover-icon" style="background: linear-gradient(135deg, #4facfe, #00f2fe);">🎨</div>
            <span>NFT</span>
          </div>
          <div class="discover-card">
            <div class="discover-icon" style="background: linear-gradient(135deg, #43e97b, #38f9d7);">💰</div>
            <span>DeFi</span>
          </div>
          <div class="discover-card">
            <div class="discover-icon" style="background: linear-gradient(135deg, #fa709a, #fee140);">🏆</div>
            <span>空投</span>
          </div>
          <div class="discover-card">
            <div class="discover-icon" style="background: linear-gradient(135deg, #a18cd1, #fbc2eb);">🗳️</div>
            <span>DAO</span>
          </div>
          <div class="discover-card">
            <div class="discover-icon" style="background: linear-gradient(135deg, #ff9a9e, #fecfef);">🎁</div>
            <span>活动</span>
          </div>
        </div>
        <div class="dapps-section">
          <div class="section-title">热门 DApp</div>
          <div class="dapp-list" id="dappList"></div>
        </div>
      </section>

      <!-- Me Tab -->
      <section class="tab-page" id="tab-me">
        <div class="me-header">
          <div class="me-avatar">W</div>
          <div class="me-name">钱包 1</div>
          <div class="me-address">0x7a8b...c9d2</div>
        </div>
        <div class="menu-list">
          <div class="menu-item">
            <span class="menu-icon">🔒</span>
            <span class="menu-label">安全中心</span>
            <svg class="menu-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
          </div>
          <div class="menu-item">
            <span class="menu-icon">⛓️</span>
            <span class="menu-label">网络管理</span>
            <svg class="menu-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
          </div>
          <div class="menu-item">
            <span class="menu-icon">🔔</span>
            <span class="menu-label">消息通知</span>
            <svg class="menu-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
          </div>
          <div class="menu-item">
            <span class="menu-icon">🌐</span>
            <span class="menu-label">语言</span>
            <svg class="menu-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
          </div>
          <div class="menu-item">
            <span class="menu-icon">❓</span>
            <span class="menu-label">帮助与反馈</span>
            <svg class="menu-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
          </div>
          <div class="menu-item">
            <span class="menu-icon">⚙️</span>
            <span class="menu-label">设置</span>
            <svg class="menu-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
          </div>
        </div>
      </section>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
      <button class="nav-item active" data-tab="wallet">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 12V8h-6M20 8l-6 6M4 12v4h6M4 16l6-6"/></svg>
        <span>资产</span>
      </button>
      <button class="nav-item" data-tab="market">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18M18.7 8l-5.1 5.2-2.8-2.7L4 15.3"/></svg>
        <span>行情</span>
      </button>
      <button class="nav-item" data-tab="trade">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/></svg>
        <span>交易</span>
      </button>
      <button class="nav-item" data-tab="discover">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg>
        <span>发现</span>
      </button>
      <button class="nav-item" data-tab="me">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>我的</span>
      </button>
    </nav>

    <!-- Wallet Selector Modal -->
    <div class="wallet-modal" id="walletModal">
      <div class="wallet-modal-overlay" id="walletModalOverlay"></div>
      <div class="wallet-modal-content">
        <div class="wallet-modal-header">
          <h3>选择钱包</h3>
          <button class="wallet-modal-close" id="walletModalClose">×</button>
        </div>
        <div class="wallet-list" id="walletList"></div>
        <button class="add-wallet-btn" id="addWalletBtn">+ 添加钱包</button>
      </div>
    </div>

    <!-- Modal -->
    <div class="modal" id="modal">
      <div class="modal-overlay"></div>
      <div class="modal-content">
        <div class="modal-header">
          <h3 id="modalTitle">提示</h3>
          <button class="modal-close" id="modalClose">×</button>
        </div>
        <div class="modal-body" id="modalBody"></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
