<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Heart - Fair Mint MEME</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="dist/style.css">
    <style>
        /* Heart Logo Animation */
        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        @keyframes glow {
            0%, 100% { filter: drop-shadow(0 0 20px rgba(0, 255, 200, 0.4)); }
            50% { filter: drop-shadow(0 0 40px rgba(0, 255, 200, 0.7)); }
        }
        .heart-logo {
            animation: heartbeat 2s ease-in-out infinite, glow 3s ease-in-out infinite;
        }
        .gradient-text {
            background: linear-gradient(135deg, #00ffd5, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .gradient-border {
            background: linear-gradient(135deg, #00ffd5, #00d4ff);
            padding: 1px;
            border-radius: 1rem;
        }
        .gradient-border > div {
            background: #0a0a0f;
            border-radius: calc(1rem - 1px);
        }
        .stat-card {
            background: linear-gradient(135deg, rgba(0, 255, 213, 0.05), rgba(0, 212, 255, 0.05));
            border: 1px solid rgba(0, 255, 213, 0.1);
        }
        .mechanism-card {
            background: linear-gradient(180deg, rgba(10, 10, 15, 0.9), rgba(0, 255, 213, 0.03));
            border: 1px solid rgba(0, 255, 213, 0.08);
        }
        .highlight-box {
            background: linear-gradient(135deg, rgba(0, 255, 213, 0.08), rgba(0, 212, 255, 0.08));
            border-left: 3px solid #00ffd5;
        }
        .progress-bar {
            background: linear-gradient(90deg, #00ffd5, #00d4ff);
        }
        .lang-en {
            display: none;
        }
        .lang-zh {
            display: block;
        }
        body.english .lang-en {
            display: block;
        }
        body.english .lang-zh {
            display: none;
        }
        body.english .lang-en-inline {
            display: inline;
        }
    </style>
    <!-- Ethers.js for Web3 -->
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
</head>
<body class="bg-[#0a0a0f] text-white font-['Inter'] antialiased english">
    <div id="app" class="max-w-md mx-auto min-h-screen pb-8">
        
        <!-- Header -->
        <header class="sticky top-0 z-50 bg-[#0a0a0f]/95 backdrop-blur-lg border-b border-white/5 px-4 py-3">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="heart-logo w-10 h-10">
                        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                            <defs>
                                <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" style="stop-color:#00ffd5;stop-opacity:1" />
                                    <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:1" />
                                </linearGradient>
                                <filter id="glow">
                                    <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                                    <feMerge>
                                        <feMergeNode in="coloredBlur"/>
                                        <feMergeNode in="SourceGraphic"/>
                                    </feMerge>
                                </filter>
                            </defs>
                            <path d="M50 85 C50 85 10 55 10 35 C10 20 25 10 35 10 C42 10 47 15 50 20 C53 15 58 10 65 10 C75 10 90 20 90 35 C90 55 50 85 50 85 Z" 
                                  fill="url(#heartGrad)" filter="url(#glow)"/>
                            <text x="50" y="52" text-anchor="middle" dominant-baseline="middle" 
                                  font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#0a0a0f">H</text>
                        </svg>
                    </div>
                    <span class="font-bold text-xl gradient-text">Heart</span>
                </div>
                <div class="flex items-center gap-2">
                    <button id="langSwitch" onclick="toggleLanguage()" class="px-3 py-1.5 rounded-lg bg-[#1a1a24] border border-[#00ffd5]/20 text-[#00ffd5] text-xs font-semibold hover:bg-[#00ffd5]/10 transition-colors">
                        中
                    </button>
                    <button id="connectBtn" onclick="connectWallet()" class="px-4 py-2 rounded-xl bg-[#1a1a24] border border-[#00ffd5]/30 text-[#00ffd5] text-xs font-semibold hover:bg-[#00ffd5]/10 transition-colors">
                    <span class="lang-zh">连接钱包</span>
                    <span class="lang-en">Connect</span>
                </button>
            </div>
        </header>
